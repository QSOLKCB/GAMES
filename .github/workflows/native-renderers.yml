name: Native Three.js gameplay
on:
  push:
    paths: ['shared/**', 'tests/**', '**/renderer.js', '**/app.js', '**/index.html', '.github/workflows/native-renderers.yml']
  pull_request:
    paths: ['shared/**', 'tests/**', '**/renderer.js', '**/app.js', '**/index.html', '.github/workflows/native-renderers.yml']
permissions:
  contents: read
jobs:
  native-webgl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix BLACKSTAR_AGA ci
      - run: npx --prefix BLACKSTAR_AGA playwright install --with-deps chromium
      - run: node tests/native-renderers.static.js
      - name: Real WebGL scene, framebuffer, resize, motion, context and lifecycle checks
        env:
          NODE_PATH: ./BLACKSTAR_AGA/node_modules
        run: node tests/native-renderers.browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-gameplay-screenshots
          path: test-results/
          if-no-files-found: ignore
