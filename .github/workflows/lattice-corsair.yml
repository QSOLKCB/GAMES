name: LATTICE CORSAIR

on:
  push:
    paths:
      - "LATTICE_CORSAIR/**"
      - "shared/**"
      - "SUBSPACE/skins.js"
      - "SOVEREIGN_LATTICE/core.js"
      - "SOVEREIGN_LATTICE/data/**"
      - "vendor/three/**"
      - ".github/workflows/lattice-corsair.yml"
  pull_request:
    paths:
      - "LATTICE_CORSAIR/**"
      - "shared/**"
      - "SUBSPACE/skins.js"
      - "SOVEREIGN_LATTICE/core.js"
      - "SOVEREIGN_LATTICE/data/**"
      - "vendor/three/**"
      - ".github/workflows/lattice-corsair.yml"

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Universe, flight, OPT conformance, data files and offline boundary
        run: npm --prefix LATTICE_CORSAIR test

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: LATTICE_CORSAIR/package-lock.json
      - name: Install pinned browser-test dependency
        run: npm --prefix LATTICE_CORSAIR ci
      - name: Reuse cached Playwright browsers
        uses: ./.github/actions/playwright-browser-cache
        with:
          prefix: LATTICE_CORSAIR
      - name: Install Chromium
        run: npx --prefix LATTICE_CORSAIR playwright install --with-deps chromium
      - name: Fly a career through the interface from file://
        run: npm --prefix LATTICE_CORSAIR run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lattice-corsair-screenshots
          path: LATTICE_CORSAIR/tests/*.png
          if-no-files-found: ignore
